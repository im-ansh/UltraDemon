name = "ultrasearch-api"
main = "src/index.ts"
compatibility_date = "2024-11-01"
compatibility_flags = ["nodejs_compat"]

# ── Cloudflare Workers settings ──────────────────────────────────────────────
[build]
command = "npm install"

[placement]
mode = "smart"

# ── D1 Database (Autonomous SQLite FTS5 Index & Storage) ─────────────────────
[[d1_databases]]
binding       = "DB"
database_name = "ultrasearch-db"
database_id   = "e33e57e5-9245-4f15-ae51-d4138bde9b46"

# ── KV Namespaces (Hot Search Cache & Key Cache) ─────────────────────────────
[[kv_namespaces]]
binding    = "SEARCH_CACHE"
id         = "ce2fd35f2a6146daa715d7e1c756df36"

[[kv_namespaces]]
binding    = "KEY_CACHE"
id         = "3dbed12421bf4ad9b5c21ac6fa2f9f8f"

# ── Durable Objects (Per-User Rate Limiting) ──────────────────────────────────
[[durable_objects.bindings]]
name       = "RATE_LIMITER"
class_name = "RateLimiter"

[[migrations]]
tag = "v1"
new_sqlite_classes = ["RateLimiter"]

# ── Crawler Background Cron Triggers (Every 15 minutes) ──────────────────────
[triggers]
crons = ["*/15 * * * *"]

# ── Environment Variables ─────────────────────────────────────────────────────
[vars]
APP_NAME          = "UltraSearch API"
APP_VERSION       = "1.0.0"
ENVIRONMENT       = "production"
SUPABASE_URL      = "https://ljybwoxyokppujhgwgre.supabase.co"
SUPABASE_ANON_KEY = "sb_publishable_4PMwPvFvADpJndmi4aBK9g_Rgr5hk9m"
