name: Publish UltraDemon to npm

on:
  workflow_dispatch:
  release:
    types: [published]

jobs:
  publish:
    name: Build & Publish to npm via OIDC
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write # Required for npm OIDC Trusted Publishing & Provenance

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Ensure latest npm with native OIDC support
        run: npm install -g npm@latest

      - name: Install SDK dependencies
        working-directory: ./sdk
        run: npm install

      - name: Build dual ESM/CJS bundles & types
        working-directory: ./sdk
        run: npm run build

      - name: Run verification test suite
        working-directory: ./sdk
        run: npm test

      - name: Publish to npm using OIDC Trusted Publishing
        working-directory: ./sdk
        run: npm publish --access public
